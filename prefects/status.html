<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prefect duty status</title>
<style>
  :root {
    --green-bg: #eaf3de; --green-fg: #27500a;
    --amber-bg: #faeeda; --amber-fg: #633806;
    --red-bg:   #fcebeb; --red-fg:   #791f1f;
    --blue-bg:  #e3ecfb; --blue-fg:  #1d3f8f;
    --muted-bg: #f1efe8; --muted-fg: #5f5e5a;
    --page:     #ffffff; --line: #e5e3db;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --green-bg: #173404; --green-fg: #c0dd97;
      --amber-bg: #412402; --amber-fg: #fac775;
      --red-bg:   #501313; --red-fg:   #f7c1c1;
      --blue-bg:  #132a52; --blue-fg:  #a9c6f5;
      --muted-bg: #2c2c2a; --muted-fg: #b4b2a9;
      --page:     #191917; --line: #35352f;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--page);
  }
  .card { border-radius: 10px; padding: 15px 17px; margin-bottom: 9px; }
  .tag { margin: 0 0 3px; font-size: 12px; opacity: .8; }
  .head { margin: 0 0 9px; font-size: 18px; font-weight: 600; line-height: 1.3; }
  .body { margin: 0 0 10px; font-size: 14px; line-height: 1.6; }
  .foot { margin: 0; font-size: 11.5px; line-height: 1.5; opacity: .72; }
  .strip { border-radius: 10px; padding: 12px 15px; margin-bottom: 9px; font-size: 13.5px; line-height: 1.55; }
  .strip p { margin: 0; }
  .strip .name { font-weight: 600; }
  .skeleton { background: var(--muted-bg); color: var(--muted-fg); }
  .chip-row { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 4px 10px; border-radius: 999px;
    background: var(--amber-bg); color: var(--amber-fg);
    font-size: 12.5px; font-weight: 600; line-height: 1.3;
  }
  .chip .icon { font-weight: 700; }
</style>
</head>
<body>

<div id="weather" class="card skeleton">
  <p class="head" style="margin:0">Loading duty status…</p>
</div>

<div id="transport" class="strip skeleton">
  <p>Checking MTR service…</p>
</div>

<div id="reminders" class="strip" style="display:none"></div>

<div id="nextDuty" class="card" style="display:none"></div>

<script>
const TONE = {
  green: ['var(--green-bg)', 'var(--green-fg)'],
  amber: ['var(--amber-bg)', 'var(--amber-fg)'],
  red:   ['var(--red-bg)',   'var(--red-fg)'],
  blue:  ['var(--blue-bg)',  'var(--blue-fg)'],
};

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
}

function paintReminders(reminders) {
  const el = document.getElementById('reminders');
  if (!reminders || !reminders.length) { el.style.display = 'none'; return; }

  el.style.display = '';
  el.style.background = 'var(--muted-bg)';
  el.style.color = 'var(--muted-fg)';
  el.innerHTML = '<div class="chip-row">' +
    reminders.map(r => '<span class="chip"><span class="icon">⚠️</span> ' + esc(r) + '</span>').join('') +
    '</div>';
}

function paintNextDuty(duty) {
  const el = document.getElementById('nextDuty');
  if (!duty) { el.style.display = 'none'; return; }

  // Neutral until it's close enough to matter — Today/Tomorrow gets the blue
  // accent so an upcoming duty stands out from one that's still a week off.
  const [bg, fg] = duty.soon ? TONE.blue : ['var(--muted-bg)', 'var(--muted-fg)'];
  el.style.display = '';
  el.style.background = bg;
  el.style.color = fg;
  el.innerHTML =
    '<p class="tag">Next duty' + (duty.relative ? ' · ' + esc(duty.relative) : '') + '</p>' +
    '<p class="head">' + esc(duty.label) + (duty.time ? ' · ' + esc(duty.time) : '') + '</p>' +
    '<p class="body" style="margin:0">' + esc(duty.location) +
    (duty.names && duty.names.length ? ' · ' + esc(duty.names.join(', ')) : '') + '</p>';
}

function paint(data) {
  paintReminders(data.reminders);
  paintNextDuty(data.nextDuty);

  const w = data.weather;
  const [bg, fg] = TONE[w.level] || TONE.amber;
  const el = document.getElementById('weather');
  el.className = 'card';
  el.style.background = bg;
  el.style.color = fg;
  el.innerHTML =
    (w.warnings.length ? '<p class="tag">' + esc(w.warnings.join(' · ')) + '</p>' : '<p class="tag">No warnings in force</p>') +
    '<p class="head">' + esc(w.headline) + '</p>' +
    '<p class="body">' + esc(w.detail) + '</p>' +
    '<p class="foot">Suspensions are confirmed by WhatsApp — check the group before leaving home. Updated ' + esc(data.updated) + '</p>';

  const t = data.transport;
  const box = document.getElementById('transport');
  if (t.ok) {
    box.className = 'strip skeleton';
    box.style.background = '';
    box.style.color = '';
    box.innerHTML = '<p>🚆 <span style="color:var(--green-fg);font-weight:700">✓</span> MTR — normal service on all lines</p>';
  } else {
    const [tbg, tfg] = TONE[t.severity];
    box.className = 'strip';
    box.style.background = tbg;
    box.style.color = tfg;
    box.innerHTML = t.alerts.map(a =>
      '<p>🚆 <span class="name">' + esc(a.label) + '</span> — ' + esc(a.reason) + '</p>'
    ).join('') + '<p style="margin-top:7px;opacity:.75;font-size:11.5px">Advisory only. Leave earlier, and reply in the group if you cannot make it.</p>';
  }
}

async function load() {
  try {
    const res = await fetch('/api/prefects/status', { cache: 'no-store' });
    paint(await res.json());
  } catch (e) {
    const el = document.getElementById('weather');
    el.className = 'card';
    el.style.background = 'var(--amber-bg)';
    el.style.color = 'var(--amber-fg)';
    el.innerHTML = '<p class="head">Status unavailable</p>' +
      '<p class="body">Could not load the duty status. Check the WhatsApp group and the HKO app directly.</p>';
    document.getElementById('transport').innerHTML = '<p>MTR status unavailable</p>';
  }
}

load();
setInterval(load, 120000);
</script>

</body>
</html>
